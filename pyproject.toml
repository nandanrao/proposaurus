[project]
name = "proposaurus"
version = "0.1.0"
description = "Shared logic, building blocks and agent tools for building branded PDF proposals"
readme = "README.md"
authors = [
    { name = "Nandan Rao", email = "nandanmarkrao@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.7",
    "openpyxl>=3.1.5",
    "pillow>=11.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "weasyprint>=69.0",
]

[project.scripts]
proposaurus = "proposaurus.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
]
